        memory: 10
    gene_scores:
        threads: 1
        memory: 10
    create_bigwigs:
        threads: 1
        memory: 10
    add_motif_annotation:
        threads: 1
        memory: 10
    dimensionality_reduction:
        threads: 1
        memory: 10
    pseudobulk_data_matrices:
        threads: 1
        memory: 10
    differential:
        threads: 1
        memory: 10

        
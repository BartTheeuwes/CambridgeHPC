################
## Parameters ##
################

pseudobulk_rna:
    # group_by: ["sample", "celltype.mapped_mnn", "celltype.mapped_seurat"]
    group_by: ["celltype.mapped_mnn", "celltype.mapped_seurat"]
    normalisation_method: "cpm"
    
doublet_detection:
    doublet_score_threshold: 1.50

mapping_mnn:
    atlas_stages: ["E6.5","E6.75","E7.0","E7.25","E7.5","E7.75","E8.0","E8.25","E8.5"]
    npcs: 50
    n_neighbours: 25

mapping_seurat:
    atlas_stages: ["E6.5","E6.75","E7.0","E7.25","E7.5","E7.75","E8.0","E8.25","E8.5"]
    npcs: 50
    n_neighbours: 25

qc:
    min_nFeature_RNA: 500
    max_nFeature_RNA: 8000
    percent_mt: 10
    percent_rib: 10
    
dimensionality_reduction:
    npcs: 30
    features: 1000
    n_neighbors: 25
    min_dist: 0.3
    colour_by: ["sample", "celltype.mapped_mnn", "celltype.mapped_seurat", "doublet_score", "doublet_call"]

dimensionality_reduction_seurat:
    npcs: 30
    features: 1000
    n_neighbors: 25
    min_dist: 0.3
    seed: 42
    vars_to_regress: ["nFeature_RNA","mitochondrial_percent_RNA"]
    colour_by: ["sample", "celltype.mapped_mnn", "celltype.mapped_seurat", "doublet_score", "doublet_call"]

celltype_validation_single_cells:
    umap: "..."
    celltype_label: "celltype.mapped_seurat"

celltype_validation_pseudobulk:
    umap: "..."
    celltype_label: "celltype.mapped_seurat"

plot_celltype_proportions:
    celltype_label: "celltype.mapped_seurat"
    # celltype_label: ["celltype.mapped_seurat","celltype.mapped_mnn"]



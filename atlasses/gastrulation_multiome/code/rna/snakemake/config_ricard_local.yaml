    mapping_mnn:
        memory: 30
        threads: 1
    mapping_seurat:
        memory: 100
        threads: 1
    parse_mapping_results:
        memory: 2
        threads: 1
    dimensionality_reduction:
        memory: 10
        threads: 1
    dimensionality_reduction_seurat:
